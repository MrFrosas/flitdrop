name: winget-test

# Valide et teste les manifestes winget AVANT de les soumettre a
# microsoft/winget-pkgs : `winget validate`, puis installation reelle via
# `winget install --manifest` repetee (le plantage vu en validation manuelle le
# 28/07/2026 etait aleatoire : un seul essai ne prouve rien), puis desinstallation.
on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/winget/**'
      - '.github/workflows/winget-test.yml'

jobs:
  winget:
    runs-on: windows-2025
    env:
      MANIFEST: packaging/winget/manifests/c/CCsGlobal/Flitdrop/0.6.3
      GUID: 13d66c6d-ea8b-5233-a385-4233ab80b29d
    steps:
      - uses: actions/checkout@v4

      # derniere version stable de winget : celle du runner (1.11) ne connait pas
      # le schema 1.12 utilise aujourd'hui par winget-pkgs
      - name: winget a jour
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/microsoft/winget-cli/releases/latest
          $bundle = $rel.assets | Where-Object name -like '*.msixbundle' | Select-Object -First 1
          $deps = $rel.assets | Where-Object name -eq 'DesktopAppInstaller_Dependencies.zip' | Select-Object -First 1
          Invoke-WebRequest $bundle.browser_download_url -OutFile winget.msixbundle
          Invoke-WebRequest $deps.browser_download_url -OutFile deps.zip
          Expand-Archive deps.zip deps
          Get-ChildItem deps -Recurse -Include *.appx | Where-Object FullName -match 'x64' | ForEach-Object {
            try { Add-AppxPackage $_.FullName -ErrorAction Stop } catch { Write-Host "dependance deja presente : $($_.Exception.Message.Split([Environment]::NewLine)[0])" }
          }
          Add-AppxPackage winget.msixbundle -ForceApplicationShutdown
          Write-Host "release : $($rel.tag_name)"
          winget --version

      - name: winget validate
        shell: pwsh
        run: |
          winget validate --manifest $env:MANIFEST --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate : echec ($LASTEXITCODE)" }

      - name: winget install --manifest (3 installations propres)
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          foreach ($i in 1..3) {
            # profil propre : aucune trace d'une installation precedente
            Remove-Item -Recurse -Force "HKCU:\Software\$env:GUID" -ErrorAction SilentlyContinue
            winget install --manifest $env:MANIFEST --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "essai $i : winget install en echec ($LASTEXITCODE)" }
            $loc = (Get-ItemProperty "HKCU:\Software\$env:GUID").InstallLocation
            if (-not (Test-Path (Join-Path $loc 'Flitdrop.exe'))) { throw "essai $i : Flitdrop.exe absent dans $loc" }
            $arp = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:GUID"
            Write-Host "essai $i : OK ($($arp.DisplayName), $loc)"
            Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force
            winget uninstall --product-code $env:GUID --silent --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "essai $i : desinstallation en echec ($LASTEXITCODE)" }
            Start-Sleep -Seconds 3
          }
