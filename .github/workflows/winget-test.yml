name: winget-test

# Valide et teste les manifestes winget AVANT de les soumettre a
# microsoft/winget-pkgs : `winget validate`, puis installation reelle via
# `winget install --manifest` repetee (le plantage vu en validation manuelle le
# 28/07/2026 etait aleatoire : un seul essai ne prouve rien), puis desinstallation.
on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/winget/**'
      - '.github/workflows/winget-test.yml'

jobs:
  winget:
    runs-on: windows-2025
    env:
      MANIFEST: packaging/winget/manifests/c/CCsGlobal/Flitdrop/0.6.3
      GUID: 13d66c6d-ea8b-5233-a385-4233ab80b29d
    steps:
      - uses: actions/checkout@v4

      # derniere version stable de winget : celle du runner (1.11) ne connait pas
      # le schema 1.12 utilise aujourd'hui par winget-pkgs
      - name: winget a jour
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/microsoft/winget-cli/releases/latest
          $bundle = $rel.assets | Where-Object name -like '*.msixbundle' | Select-Object -First 1
          $deps = $rel.assets | Where-Object name -eq 'DesktopAppInstaller_Dependencies.zip' | Select-Object -First 1
          Invoke-WebRequest $bundle.browser_download_url -OutFile winget.msixbundle
          Invoke-WebRequest $deps.browser_download_url -OutFile deps.zip
          Expand-Archive deps.zip deps
          Get-ChildItem deps -Recurse -Include *.appx | Where-Object FullName -match 'x64' | ForEach-Object {
            try { Add-AppxPackage $_.FullName -ErrorAction Stop } catch { Write-Host "dependance deja presente" }
          }
          Add-AppxPackage winget.msixbundle -ForceApplicationShutdown
          Write-Host "release : $($rel.tag_name)"
          winget --version

      - name: winget validate
        shell: pwsh
        run: |
          winget validate --manifest $env:MANIFEST --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate : echec ($LASTEXITCODE)" }

      # Diagnostic : l'installeur lance par winget ne rendait pas la main alors que
      # le meme /S termine en 7 s. Hypothese : la marque « telecharge d'Internet »
      # (Zone.Identifier) declenche une fenetre de securite invisible sur un runner.
      # Chaque essai a un delai maximum et liste les fenetres ouvertes s'il bloque.
      - name: installeur /S, sans puis avec marque Internet
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'flitdrop-setup.exe'
          Invoke-WebRequest 'https://github.com/MrFrosas/flitdrop/releases/download/v0.6.3/Flitdrop-Setup-0.6.3.exe' -OutFile $exe
          function Try-Install([string]$label) {
            Remove-Item -Recurse -Force "HKCU:\Software\$env:GUID" -ErrorAction SilentlyContinue
            $p = Start-Process $exe -ArgumentList '/S' -PassThru
            if (-not $p.WaitForExit(120000)) {
              Write-Host "$label : BLOQUE apres 120 s. Fenetres ouvertes :"
              Get-Process | Where-Object MainWindowTitle | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host
              Stop-Process -Id $p.Id -Force
              return
            }
            Write-Host "$label : termine, code $($p.ExitCode)"
            Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force
            $u = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$env:GUID" -ErrorAction SilentlyContinue).QuietUninstallString
            if ($u) { cmd /c $u; Start-Sleep -Seconds 3 }
          }
          Try-Install 'sans marque Internet'
          Set-Content -Path $exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          Try-Install 'avec marque Internet'

      - name: winget install --manifest (3 installations, delai max)
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          foreach ($i in 1..3) {
            Remove-Item -Recurse -Force "HKCU:\Software\$env:GUID" -ErrorAction SilentlyContinue
            $wargs = @('install', '--manifest', $env:MANIFEST, '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity')
            $p = Start-Process winget -ArgumentList $wargs -NoNewWindow -PassThru
            if (-not $p.WaitForExit(180000)) {
              Write-Host "essai $i : winget BLOQUE apres 180 s. Processus et fenetres :"
              Get-Process | Where-Object { $_.MainWindowTitle -or $_.ProcessName -match 'Flitdrop|Setup|winget|smartscreen|consent' } | Select-Object ProcessName, Id, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host
              Get-Process | Where-Object ProcessName -match 'Flitdrop|winget' | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "essai $i : bloque"
            }
            if ($p.ExitCode -ne 0) { throw "essai $i : winget install en echec ($($p.ExitCode))" }
            $loc = (Get-ItemProperty "HKCU:\Software\$env:GUID").InstallLocation
            if (-not (Test-Path (Join-Path $loc 'Flitdrop.exe'))) { throw "essai $i : Flitdrop.exe absent dans $loc" }
            Write-Host "essai $i : OK ($loc)"
            Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force
            winget uninstall --product-code $env:GUID --silent --disable-interactivity
            Start-Sleep -Seconds 3
          }
