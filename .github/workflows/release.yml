name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Le CI construit et TESTE Windows (.exe signe) et Linux (AppImage + .deb), puis
# une seule etape publie la release quand les deux ont reussi : une release ne
# peut plus sortir a moitie. Le .dmg macOS (arm64 + x64) est construit en local
# et attache ensuite (appdmg ne compile pas sur le Node du runner) : voir
# docs/release.md.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Build du coeur
        run: npm run build -w @flitdrop/core

      - name: Typecheck
        run: npm run typecheck -w @flitdrop/core

      - name: Tests
        run: npm test -w @flitdrop/core

      - name: Empaqueter l'installeur Windows
        run: npm run dist:win:ci -w @flitdrop/desktop
        env:
          # Signature Azure Trusted Signing (voir electron-builder.yml > win.azureSignOptions).
          # EnvironmentCredential : TENANT_ID + CLIENT_ID requis, CLIENT_SECRET pour le principal.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Installation silencieuse reelle (comme le Microsoft Store et winget : /S),
      # dans un profil neuf, puis verification du dossier et de la cle de
      # desinstallation. Attrape un installeur qui plante au 1er lancement.
      - name: Tester l'installation silencieuse
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature : $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installeur non signe ou signature invalide" }
          Remove-Item -Recurse -Force "HKCU:\Software\13d66c6d-ea8b-5233-a385-4233ab80b29d" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installation silencieuse en echec ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Flitdrop\Flitdrop.exe'
          if (-not (Test-Path $app)) { throw "Flitdrop.exe absent apres installation : $app" }
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\13d66c6d-ea8b-5233-a385-4233ab80b29d'
          if (-not (Test-Path $arp)) { throw "cle de desinstallation absente" }
          Get-ItemProperty $arp | Select-Object DisplayName, DisplayVersion, Publisher | Format-List
          Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: flitdrop-windows
          # .exe + .blockmap + latest.yml : requis par l'auto-update (electron-updater)
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Outils de test (ecran virtuel, presse-papiers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xclip xauth libfuse2t64

      - name: Installer les dependances
        run: npm ci

      - name: Build du coeur
        run: npm run build -w @flitdrop/core

      - name: Typecheck
        run: npm run typecheck -w @flitdrop/core

      # sous xvfb avec xclip : active l'aller-retour reel du presse-papiers Linux
      - name: Tests (dont presse-papiers X11 reel)
        run: xvfb-run -a npm test -w @flitdrop/core
        env:
          FLITDROP_CLIP_TEST: '1'

      - name: Empaqueter AppImage + .deb
        run: npm run dist:linux:ci -w @flitdrop/desktop

      # Lancement comme un utilisateur d'Ubuntu 24.04 de bureau : double-clic sur
      # l'AppImage, sans argument, avec la restriction des espaces de noms
      # utilisateur ACTIVE (reglage par defaut d'Ubuntu 24.04). L'app doit
      # demarrer et son serveur local repondre.
      - name: Tester l'AppImage (lancement reel)
        run: |
          set -eu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          cd apps/desktop/release
          APPIMAGE_FILE=$(ls Flitdrop-*.AppImage | head -1)
          chmod +x "$APPIMAGE_FILE"
          export FLITDROP_HOME="$RUNNER_TEMP/fd-appimage"
          xvfb-run -a "./$APPIMAGE_FILE" --hidden > "$RUNNER_TEMP/appimage.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:47777/s/; then ok=1; echo "AppImage prete en ${i}s"; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "l'app s'est arretee"; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/appimage.log" | tail -40
          [ "$ok" = 1 ] || { echo "ECHEC : le serveur local ne repond pas"; exit 1; }
          curl -fsS http://127.0.0.1:47777/s/ | grep -qi flitdrop
          pkill -f flitdrop-bin || true
          sleep 2

      - name: Tester le .deb (installation + lancement)
        run: |
          set -eu
          cd apps/desktop/release
          DEB_FILE=$(ls Flitdrop-*.deb | head -1)
          sudo apt-get install -y -q "./$DEB_FILE"
          test -x /opt/Flitdrop/flitdrop-bin
          stat -c '%A %U' /opt/Flitdrop/chrome-sandbox
          export FLITDROP_HOME="$RUNNER_TEMP/fd-deb"
          xvfb-run -a flitdrop --hidden > "$RUNNER_TEMP/deb.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:47777/s/; then ok=1; echo ".deb pret en ${i}s"; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "l'app s'est arretee"; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/deb.log" | tail -40
          [ "$ok" = 1 ] || { echo "ECHEC : le serveur local ne repond pas"; exit 1; }
          pkill -f flitdrop-bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: flitdrop-linux
          # AppImage + latest-linux.yml : auto-update Linux ; .deb : installation classique
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # brouillon : le .dmg Mac (construit en local) est attache AVANT la mise
          # en ligne, puis `gh release edit vX.Y.Z --draft=false`. Un brouillon est
          # invisible pour releases/latest et pour l'auto-update : rien ne sort a moitie.
          draft: true
          generate_release_notes: true
          body: |
            Flitdrop. L'AirDrop multi-OS, chiffre de bout en bout. Rien a installer sur le telephone.

            - **Windows** : `Flitdrop-Setup-x.y.z.exe`, signe (editeur verifie : CC's Global). Aussi sur le Microsoft Store : https://apps.microsoft.com/detail/XPDCK4DDN3LK69
            - **Mac** : `...-arm64.dmg` (Apple Silicon) ou `...-x64.dmg` (Intel). Glissez Flitdrop dans Applications. Au 1er lancement : clic droit > Ouvrir (l'app n'est pas encore notarisee par Apple).
            - **Linux** : `.AppImage` (toutes distributions, se met a jour tout seul) ou `.deb` (Ubuntu, Debian, Mint). Presse-papiers : installez `wl-clipboard` (Wayland) ou `xclip` (X11).

            Au premier lancement, scannez le QR code avec le telephone, et c'est appaire.
