name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# construction en lecture seule ; seul le job « publish » peut ecrire la
# release (un paquet npm compromis pendant le build ne peut rien publier)
permissions:
  contents: read

# Le CI construit et TESTE Windows (.exe signe) et Linux (AppImage + .deb), puis
# une seule etape publie la release quand les deux ont reussi : une release ne
# peut plus sortir a moitie. Le .dmg macOS (arm64 + x64) est construit en local
# et attache ensuite (appdmg ne compile pas sur le Node du runner) : voir
# docs/release.md.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Build du coeur
        run: npm run build -w @flitdrop/core

      - name: Typecheck
        run: npm run typecheck -w @flitdrop/core

      - name: Tests
        run: npm test -w @flitdrop/core

      - name: Empaqueter l'installeur Windows
        run: npm run dist:win:ci -w @flitdrop/desktop
        env:
          # Signature Azure Trusted Signing (voir electron-builder.yml > win.azureSignOptions).
          # EnvironmentCredential : TENANT_ID + CLIENT_ID requis, CLIENT_SECRET pour le principal.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # La mise a jour automatique doit exiger la signature CC's Global :
      # sans publisherName dans app-update.yml, elle ne la verifie pas.
      - name: Verifier que la mise a jour exige la signature
        shell: pwsh
        run: |
          $f = 'apps/desktop/release/win-unpacked/resources/app-update.yml'
          Get-Content $f | Write-Host
          if (-not (Select-String -Path $f -Pattern "publisherName" -Quiet)) { throw "app-update.yml sans publisherName : la signature des mises a jour ne serait pas verifiee" }

      # Installation silencieuse reelle (comme le Microsoft Store et winget : /S),
      # dans un profil neuf, puis verification du dossier et de la cle de
      # desinstallation. Attrape un installeur qui plante au 1er lancement.
      - name: Tester l'installation silencieuse
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature : $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installeur non signe ou signature invalide" }
          Remove-Item -Recurse -Force "HKCU:\Software\13d66c6d-ea8b-5233-a385-4233ab80b29d" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installation silencieuse en echec ($($p.ExitCode))" }
          # dossier reel lu dans le registre (electron-builder nomme le dossier
          # d'apres le paquet, pas forcement « Flitdrop »)
          $loc = (Get-ItemProperty 'HKCU:\Software\13d66c6d-ea8b-5233-a385-4233ab80b29d').InstallLocation
          Write-Host "InstallLocation : $loc"
          $app = Join-Path $loc 'Flitdrop.exe'
          if (-not (Test-Path $app)) { throw "Flitdrop.exe absent apres installation : $app" }
          if ($loc -ne (Join-Path $env:LOCALAPPDATA "Programs\$(Split-Path $loc -Leaf)")) { throw "dossier inattendu : $loc" }
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\13d66c6d-ea8b-5233-a385-4233ab80b29d'
          if (-not (Test-Path $arp)) { throw "cle de desinstallation absente" }
          Get-ItemProperty $arp | Select-Object DisplayName, DisplayVersion, Publisher | Format-List
          Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force

      # Fusibles d'Electron (voir apps/desktop/build/fuses.cjs) relus dans l'exe
      # INSTALLE, puis lancement reel : l'app doit demarrer et son serveur local
      # repondre (sans l'empreinte de app.asar dans l'exe, l'app s'arreterait
      # net). Enfin une copie du dossier installe doit demarrer elle aussi, puis
      # refuser de demarrer une fois app.asar change d'un octet (un commentaire
      # de main.cjs, sans effet sur le code).
      - name: Tester le lancement, les fusibles et l'integrite
        shell: pwsh
        run: |
          $loc = (Get-ItemProperty 'HKCU:\Software\13d66c6d-ea8b-5233-a385-4233ab80b29d').InstallLocation
          $app = Join-Path $loc 'Flitdrop.exe'
          node apps/desktop/build/fuses.cjs verifier $app win32
          if ($LASTEXITCODE -ne 0) { throw "fusibles inattendus dans l'exe installe" }
          $env:FLITDROP_NO_TELEMETRY = '1'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          function Test-Launch([string]$exe, [string]$dataDir) {
            Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            $env:FLITDROP_HOME = $dataDir
            $log = "$dataDir.log"
            $p = Start-Process -FilePath $exe -ArgumentList '--hidden' -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError $log
            $ok = $false
            for ($i = 1; $i -le 60; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:47777/s/' | Out-Null
                $ok = $true
                Write-Host "serveur local pret en ${i}s"
                break
              } catch {}
              if ($p.HasExited) { Write-Host "l'app s'est arretee (code $($p.ExitCode))"; break }
              Start-Sleep -Seconds 1
            }
            Get-Process Flitdrop -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if (Test-Path $log) { Get-Content $log -Tail 15 | ForEach-Object { Write-Host "  $_" } }
            return $ok
          }
          if (-not (Test-Launch $app (Join-Path $env:RUNNER_TEMP 'fd-win'))) { throw "ECHEC : l'app installee ne demarre pas (serveur local muet)" }
          $copy = Join-Path $env:RUNNER_TEMP 'fd-copie'
          Copy-Item -Recurse $loc $copy
          $copyExe = Join-Path $copy 'Flitdrop.exe'
          if (-not (Test-Launch $copyExe (Join-Path $env:RUNNER_TEMP 'fd-copie-home'))) { throw "ECHEC : la copie intacte ne demarre pas (le test d'integrite ne prouverait rien)" }
          node apps/desktop/build/fuses.cjs alterer-asar (Join-Path $copy 'resources\app.asar') main.cjs
          if ($LASTEXITCODE -ne 0) { throw "modification de app.asar impossible" }
          if (Test-Launch $copyExe (Join-Path $env:RUNNER_TEMP 'fd-altere-home')) { throw "ECHEC : une app.asar modifiee demarre quand meme (integrite inactive)" }
          Write-Host "app.asar modifiee : l'app refuse de demarrer, comme prevu"

      - uses: actions/upload-artifact@v4
        with:
          name: flitdrop-windows
          # .exe + .blockmap + latest.yml : requis par l'auto-update (electron-updater)
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Outils de test (ecran virtuel, presse-papiers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xclip xauth libfuse2t64

      - name: Installer les dependances
        run: npm ci

      - name: Build du coeur
        run: npm run build -w @flitdrop/core

      - name: Typecheck
        run: npm run typecheck -w @flitdrop/core

      # sous xvfb avec xclip : active l'aller-retour reel du presse-papiers Linux
      - name: Tests (dont presse-papiers X11 reel)
        run: xvfb-run -a npm test -w @flitdrop/core
        env:
          FLITDROP_CLIP_TEST: '1'

      - name: Empaqueter AppImage + .deb
        run: npm run dist:linux:ci -w @flitdrop/desktop

      # fusibles d'Electron relus dans le binaire reel (le lanceur le renomme
      # flitdrop-bin, voir apps/desktop/build/afterPack.cjs)
      - name: Verifier les fusibles
        run: node apps/desktop/build/fuses.cjs verifier apps/desktop/release/linux-unpacked/flitdrop-bin linux

      # Lancement comme un utilisateur d'Ubuntu 24.04 de bureau : double-clic sur
      # l'AppImage, sans argument, avec la restriction des espaces de noms
      # utilisateur ACTIVE (reglage par defaut d'Ubuntu 24.04). L'app doit
      # demarrer et son serveur local repondre.
      - name: Tester l'AppImage (lancement reel)
        run: |
          set -eu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          cd apps/desktop/release
          APPIMAGE_FILE=$(ls Flitdrop-*.AppImage | head -1)
          chmod +x "$APPIMAGE_FILE"
          export FLITDROP_HOME="$RUNNER_TEMP/fd-appimage"
          xvfb-run -a "./$APPIMAGE_FILE" --hidden > "$RUNNER_TEMP/appimage.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:47777/s/; then ok=1; echo "AppImage prete en ${i}s"; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "l'app s'est arretee"; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/appimage.log" | tail -40
          [ "$ok" = 1 ] || { echo "ECHEC : le serveur local ne repond pas"; exit 1; }
          curl -fsS http://127.0.0.1:47777/s/ | grep -qi flitdrop
          pkill -f flitdrop-bin || true
          sleep 2

      - name: Tester le .deb (installation + lancement)
        run: |
          set -eu
          cd apps/desktop/release
          DEB_FILE=$(ls Flitdrop-*.deb | head -1)
          sudo apt-get install -y -q "./$DEB_FILE"
          test -x /opt/Flitdrop/flitdrop-bin
          node "$GITHUB_WORKSPACE/apps/desktop/build/fuses.cjs" verifier /opt/Flitdrop/flitdrop-bin linux
          stat -c '%A %U' /opt/Flitdrop/chrome-sandbox
          # doit etre setuid root (-rwsr-xr-x) : voir build/linux/after-install.tpl
          [ "$(stat -c '%a %U' /opt/Flitdrop/chrome-sandbox)" = "4755 root" ]
          export FLITDROP_HOME="$RUNNER_TEMP/fd-deb"
          xvfb-run -a flitdrop --hidden > "$RUNNER_TEMP/deb.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:47777/s/; then ok=1; echo ".deb pret en ${i}s"; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "l'app s'est arretee"; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/deb.log" | tail -40
          [ "$ok" = 1 ] || { echo "ECHEC : le serveur local ne repond pas"; exit 1; }
          pkill -f flitdrop-bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: flitdrop-linux
          # AppImage + latest-linux.yml : auto-update Linux ; .deb : installation classique
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # brouillon : le .dmg Mac (construit en local) est attache AVANT la mise
          # en ligne, puis `gh release edit vX.Y.Z --draft=false`. Un brouillon est
          # invisible pour releases/latest et pour l'auto-update : rien ne sort a moitie.
          draft: true
          generate_release_notes: true
          body: |
            Flitdrop. L'AirDrop multi-OS, chiffre de bout en bout. Rien a installer sur le telephone.

            - **Windows** : `Flitdrop-Setup-x.y.z.exe`, signe (editeur verifie : CC's Global). En ligne de commande : `winget install CCsGlobal.Flitdrop`. Aussi sur le Microsoft Store : https://apps.microsoft.com/detail/XPDCK4DDN3LK69
            - **Mac** : `...-arm64.dmg` (Apple Silicon) ou `...-x64.dmg` (Intel). Glissez Flitdrop dans Applications. Au 1er lancement (l'app n'est pas encore notarisee par Apple) : ouvrez-la une fois, puis Reglages Systeme > Confidentialite et securite > Ouvrir quand meme. Si macOS la dit endommagee : `xattr -cr /Applications/Flitdrop.app` dans le Terminal. L'app Mac signale elle-meme les nouvelles versions.
            - **Linux** : `.AppImage` (toutes distributions, se met a jour tout seul) ou `.deb` (Ubuntu, Debian, Mint). Presse-papiers : installez `wl-clipboard` (Wayland) ou `xclip` (X11).

            Au premier lancement, scannez le QR code avec le telephone, et c'est appaire.

            Statistiques : des statistiques anonymes de base (sans identifiant, jamais vos fichiers) sont actives par defaut, apres un message dans l'app, et se coupent dans Reglages > Aide et confidentialite. Les statistiques detaillees et les rapports d'erreur ne partent qu'avec votre accord. Details : https://flitdrop.com/privacy
